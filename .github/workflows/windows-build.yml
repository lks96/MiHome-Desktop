name: Windows test package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-cs2.*'

permissions:
  contents: read

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler for minimal LGPL video helper
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64-posix nasm make
      - name: Build verified FFmpeg source with Media Foundation support
        run: python3 scripts/prepare-windows-media.py
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-media-helper
          path: src-tauri/resources/ffmpeg/
          if-no-files-found: error
  windows:
    needs: media
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Windows-media-helper
          path: src-tauri/resources/ffmpeg/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Rust services
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib --locked
      - name: Build Windows executable and NSIS installer
        run: pnpm tauri build --bundles nsis -- --locked
      - name: Seed a database from the previous Windows schema
        shell: pwsh
        run: |
          @'
          import hashlib
          import os
          import sqlite3
          from pathlib import Path

          data_dir = Path(os.environ["APPDATA"]) / "com.lks96.mihome-desktop"
          data_dir.mkdir(parents=True, exist_ok=True)
          with sqlite3.connect(data_dir / "mihome.sqlite") as db:
              db.execute("""
                  CREATE TABLE _sqlx_migrations (
                      version BIGINT PRIMARY KEY,
                      description TEXT NOT NULL,
                      installed_on TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
                      success BOOLEAN NOT NULL,
                      checksum BLOB NOT NULL,
                      execution_time BIGINT NOT NULL
                  )
              """)
              for path in sorted(Path("src-tauri/src/database/migrations").glob("*.sql")):
                  version, description = path.stem.split("_", 1)
                  if int(version) not in range(1, 6):
                      continue
                  sql = path.read_text(encoding="utf-8").replace("\n", "\r\n")
                  db.executescript(sql)
                  db.execute(
                      "INSERT INTO _sqlx_migrations (version, description, success, checksum, execution_time) VALUES (?, ?, 1, ?, 0)",
                      (int(version), description, hashlib.sha384(sql.encode("utf-8")).digest()),
                  )
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the upgrade-test database' }
      - name: Verify Windows installer and startup with a legacy database
        shell: pwsh
        timeout-minutes: 4
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'mihome-smoke'
          $setup = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDir" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "Installer exited with code $($setup.ExitCode)" }
          $exe = Join-Path $installDir 'mi-home-desktop.exe'
          if (!(Test-Path $exe)) { throw 'Installed application executable is missing' }
          $logDir = Join-Path $env:LOCALAPPDATA 'com.lks96.mihome-desktop/logs'
          $process = Start-Process -FilePath $exe -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(45)
            do {
              Start-Sleep -Seconds 1
              $process.Refresh()
              if ($process.HasExited) { throw "Application exited at startup with code $($process.ExitCode)" }
              $logs = Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue
              $initialized = $logs | Select-String -SimpleMatch 'Application initialized' -Quiet
            } until ($initialized -or (Get-Date) -gt $deadline)
            if (!$initialized) { throw 'Application did not complete startup' }
            Start-Sleep -Seconds 10
            $process.Refresh()
            if ($process.HasExited) { throw "Application exited after initialization with code $($process.ExitCode)" }
          } catch {
            Get-ChildItem $logDir -Filter '*.log' -ErrorAction SilentlyContinue | Get-Content -Tail 25
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-3) } -ErrorAction SilentlyContinue |
              Where-Object { $_.Message -like '*mi-home-desktop.exe*' } |
              Select-Object -First 5 TimeCreated, Id, Message | Format-List
            throw
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id }
          }
      - name: Hash executable and installer
        shell: pwsh
        run: |
          $artifacts = @('src-tauri/target/release/mi-home-desktop.exe') + @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | ForEach-Object { $_.FullName })
          $lines = foreach ($artifact in $artifacts) {
            $hash = Get-FileHash -Algorithm SHA256 $artifact
            '{0}  {1}' -f $hash.Hash.ToLower(), (Split-Path $artifact -Leaf)
          }
          $lines | Set-Content 'SHA256SUMS.txt' -Encoding utf8
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: MiHome-Desktop-Windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/mi-home-desktop.exe
            src-tauri/resources/ffmpeg/
            THIRD_PARTY_NOTICES.md
            licenses/
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
            docs/WINDOWS_TESTING.md

  release:
    if: github.ref_type == 'tag'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MiHome-Desktop-Windows-x64
          path: package
      - name: Publish Windows x64 installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t installers < <(find package -name '*-setup.exe' -type f)
          test "${#installers[@]}" -eq 1
          installer="${installers[0]}"
          cp -- "$installer" MiHome-Desktop-Windows-x64-setup.exe
          sha256sum MiHome-Desktop-Windows-x64-setup.exe > Windows-Installer-SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --prerelease --title "$GITHUB_REF_NAME Windows x64" \
            --notes '独立观看窗口以视频为主，工具栏和诊断按需显示。点击暂停或恢复，拖动控制四向云台。新增超清档和实际分辨率。云台和超清仍需摄像头实测。安装包未签名。' \
            MiHome-Desktop-Windows-x64-setup.exe Windows-Installer-SHA256SUMS.txt
