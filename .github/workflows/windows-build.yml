name: Windows test package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-cs2.*'

permissions:
  contents: read

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler for minimal LGPL video helper
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64-posix nasm make
      - name: Build verified FFmpeg source with Media Foundation support
        run: python3 scripts/prepare-windows-media.py
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-media-helper
          path: src-tauri/resources/ffmpeg/
          if-no-files-found: error
  windows:
    needs: media
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Windows-media-helper
          path: src-tauri/resources/ffmpeg/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test Rust services
        run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --lib --locked
      - name: Build Windows executable and NSIS installer
        run: pnpm tauri build --bundles nsis -- --locked
      - name: Hash executable and installer
        shell: pwsh
        run: |
          $artifacts = @('src-tauri/target/release/mi-home-desktop.exe') + @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | ForEach-Object { $_.FullName })
          $lines = foreach ($artifact in $artifacts) {
            $hash = Get-FileHash -Algorithm SHA256 $artifact
            '{0}  {1}' -f $hash.Hash.ToLower(), (Split-Path $artifact -Leaf)
          }
          $lines | Set-Content 'SHA256SUMS.txt' -Encoding utf8
      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: MiHome-Desktop-Windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/mi-home-desktop.exe
            src-tauri/resources/ffmpeg/
            THIRD_PARTY_NOTICES.md
            licenses/
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
            docs/WINDOWS_TESTING.md

  release:
    if: github.ref_type == 'tag'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MiHome-Desktop-Windows-x64
          path: package
      - name: Publish Windows x64 installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mapfile -t installers < <(find package -name '*-setup.exe' -type f)
          test "${#installers[@]}" -eq 1
          installer="${installers[0]}"
          cp -- "$installer" MiHome-Desktop-Windows-x64-setup.exe
          sha256sum MiHome-Desktop-Windows-x64-setup.exe > Windows-Installer-SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --prerelease --title "$GITHUB_REF_NAME Windows x64" \
            --notes '实验版包含现场声音、麦克风对讲和四向云台。需要 chuangmi.camera.039a01 实机验证。安装包未签名。' \
            MiHome-Desktop-Windows-x64-setup.exe Windows-Installer-SHA256SUMS.txt
